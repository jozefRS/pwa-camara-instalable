<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de cámara</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
  <main>
    <h1>Visor de cámara</h1>

    <video id="visor-camara" autoplay playsinline muted></video>

    <p id="mensaje-estado">Cámara apagada.</p>

    <div class="controles">
      <button id="btn-alternar-camara" type="button">Cambiar cámara</button>
      <button id="btn-apagar-camara" type="button">Apagar cámara</button>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
